<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة الطقس v6 🌈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root { --glass:rgba(24,8,70,.3); --line:rgba(255,255,255,.35); --ac:#ffc83d; --tc:#4ade80; }

  /* لكل حالة: ألوان السماء (a,b,c) وألوان التلال (h1,h2). ولا لون رمادي */
  body.sun, body.sunclouds { --a:#0b5cff; --b:#2fb4ff; --c:#8bf0ff; --h1:#19c37d; --h2:#0e9f6e; }
  body.dusk        { --a:#24105e; --b:#c2338f; --c:#ff8a3c; --h1:#7a2a9c; --h2:#4a1672; }
  body.dawn        { --a:#3a3ad6; --b:#e063b8; --c:#ffb88a; --h1:#c35ab0; --h2:#8a3a9a; }
  body.night       { --a:#0a0538; --b:#2b1a8f; --c:#7b2fd0; --h1:#2a1a7a; --h2:#160d52; }
  body.nightclouds { --a:#120a4a; --b:#3a2a9c; --c:#b03aa8; --h1:#2e1a6b; --h2:#1a0f4a; }
  body.clouds      { --a:#3b5bff; --b:#8b6bff; --c:#ff9ad5; --h1:#6a4fe0; --h2:#4733b8; }
  body.shower      { --a:#1560ff; --b:#35a8ff; --c:#2de2c8; --h1:#12b5a0; --h2:#0a8a9c; }
  body.rain        { --a:#0a1a6b; --b:#2a5bd7; --c:#1ad3d9; --h1:#0f8fb0; --h2:#0a5f9a; }
  body.storm       { --a:#14083f; --b:#5a1fb0; --c:#e0309a; --h1:#7a22b8; --h2:#45107a; }
  body.snow        { --a:#2f6bff; --b:#7cc4ff; --c:#ffc2e8; --h1:#e9f5ff; --h2:#bfe0ff; }
  body.fog         { --a:#6c4cff; --b:#c06bff; --c:#ff9ecf; --h1:#ff9ecf; --h2:#ffb68a; }

  [hidden] { display:none !important; }
  * { box-sizing:border-box; margin:0; }
  html, body { min-height:100%; }
  body {
    font-family:"IBM Plex Sans Arabic", system-ui, sans-serif; color:#fff; text-shadow:0 1px 14px rgba(0,0,0,.3);
    background:linear-gradient(180deg,var(--a,#3a7bd5),var(--b,#6aa8ff) 55%,var(--c,#9fd3f5)) fixed; overflow-x:hidden;
  }
  /* كرات ضوء ملونة تسبح بالخلفية */
  body::before, body::after { content:""; position:fixed; z-index:0; width:60vmax; height:60vmax; border-radius:50%;
    filter:blur(50px); mix-blend-mode:screen; pointer-events:none; }
  body::before { left:-22vmax; top:-22vmax; background:radial-gradient(circle,var(--ac),transparent 62%); opacity:.4; animation:orb 18s ease-in-out infinite alternate; }
  body::after  { right:-26vmax; bottom:-26vmax; background:radial-gradient(circle,#ff5ec8,transparent 62%); opacity:.3; animation:orb 22s ease-in-out infinite alternate-reverse; }

  /* ===== المشهد المتحرك ===== */
  #scene { --mx:0; --my:0; position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  #scene div { position:absolute; }
  .hills { left:0; right:0; bottom:0; height:24vh; scale:1.08; translate:calc(var(--mx)*14px) 0; transition:translate .5s ease-out;
    background:radial-gradient(120% 100% at 18% 100%,var(--h1) 0 50%,transparent 51%),
               radial-gradient(120% 100% at 85% 100%,var(--h2) 0 46%,transparent 47%); }

  .sun { right:10vw; top:20vh; width:clamp(110px,22vw,170px); aspect-ratio:1; border-radius:50%;
    background:radial-gradient(circle,#fffbd0 0 55%,#ffd84d 56% 100%); box-shadow:0 0 70px 36px rgba(255,190,40,.6);
    translate:calc(var(--mx)*-34px) calc(var(--my)*-24px); transition:translate .5s ease-out;
    animation:rise 3s cubic-bezier(.15,.8,.2,1) both, pulse 4s ease-in-out 3s infinite alternate; }
  .sun::before { content:""; position:absolute; inset:-75px; border-radius:50%;
    background:repeating-conic-gradient(rgba(255,236,150,.7) 0 5deg,transparent 5deg 18deg);
    -webkit-mask-image:radial-gradient(circle,transparent 36%,#000 38% 60%,transparent 72%);
            mask-image:radial-gradient(circle,transparent 36%,#000 38% 60%,transparent 72%);
    animation:spin 50s linear infinite; }
  body.dusk .sun, body.dawn .sun { top:46vh; background:radial-gradient(circle,#fff1d0 0 50%,#ff7a2e 51% 100%); box-shadow:0 0 90px 50px rgba(255,90,60,.6); }
  body.dusk .sun::before, body.dawn .sun::before { background:repeating-conic-gradient(rgba(255,150,100,.65) 0 5deg,transparent 5deg 18deg); }

  .moon { right:12vw; top:20vh; width:clamp(90px,18vw,130px); aspect-ratio:1; border-radius:50%; box-shadow:inset -26px -8px 0 0 #fff4c2;
    filter:drop-shadow(0 0 26px rgba(255,220,255,.7)); translate:calc(var(--mx)*-34px) calc(var(--my)*-24px); transition:translate .5s ease-out;
    animation:rise 3s cubic-bezier(.15,.8,.2,1) both; }
  .star { width:2px; height:2px; border-radius:50%; background:var(--c); animation:twinkle 3s ease-in-out infinite; }

  .cloud { width:var(--w); height:calc(var(--w)*.28); border-radius:999px; background:var(--c); filter:drop-shadow(0 10px 16px rgba(40,0,90,.25));
    translate:calc(var(--mx)*var(--k,1)*-22px) calc(var(--my)*var(--k,1)*-10px); transition:translate .5s ease-out;
    animation:cloudIn 3.2s ease-out both, drift var(--d) ease-in-out infinite alternate; }
  .cloud::before, .cloud::after { content:""; position:absolute; background:inherit; border-radius:50%; }
  .cloud::before { width:42%; height:160%; left:14%; bottom:35%; }
  .cloud::after  { width:34%; height:125%; right:16%; bottom:35%; }

  .rain { inset:0; animation:fadeIn 1.2s 2.4s both; }
  .drop { top:24vh; width:2px; height:22px; animation:drop linear infinite; }
  .splash { width:26px; height:7px; border:1.5px solid; border-radius:50%; animation:ripple 1s ease-out infinite; }
  .flake { top:-4vh; width:7px; height:7px; border-radius:50%; animation:snow linear infinite; }
  .fogband { left:-20vw; width:140vw; height:17vh; border-radius:50%; filter:blur(26px); background:var(--c); opacity:.6;
    animation:fogIn 3s ease-out both, drift var(--d) ease-in-out infinite alternate; }

  .flash { inset:0; background:#fff; opacity:0; animation:flash 7s 3s infinite; }
  .bolt { left:58%; top:18vh; width:60px; height:46vh; background:#fff8c4; opacity:0; clip-path:polygon(55% 0,15% 52%,45% 52%,25% 100%,85% 40%,52% 40%,75% 0);
    filter:drop-shadow(0 0 14px #ff5ec8); animation:flash 7s 3s infinite; }

  .aurora { left:-10vw; right:-10vw; top:4vh; height:46vh; opacity:0; mix-blend-mode:screen; filter:blur(38px) hue-rotate(var(--h,0deg));
    translate:calc(var(--mx)*-40px) calc(var(--my)*-16px); transition:translate .6s ease-out;
    background:linear-gradient(100deg,transparent 5%,#2cffb0 25%,#3fa9ff 45%,#b36bff 65%,#ff6bd5 80%,transparent 95%);
    clip-path:polygon(0 70%,12% 40%,28% 62%,45% 20%,60% 55%,78% 25%,100% 60%,100% 100%,0 100%);
    animation:auroraIn 4s 1s ease-out forwards, auroraWave 9s ease-in-out 5s infinite alternate; }
  .rainbow { left:50%; bottom:0; width:150vw; height:64vh; margin-left:-75vw; opacity:0; animation:rbIn 4s 4.5s ease-out forwards;
    background:radial-gradient(circle at 50% 100%,transparent 0 44vh,rgba(255,60,60,.65) 44.5vh,rgba(255,150,40,.65) 47vh,rgba(255,235,60,.65) 50vh,
      rgba(80,220,110,.65) 53vh,rgba(70,160,255,.65) 56vh,rgba(130,90,255,.65) 59vh,transparent 60vh); }

  @keyframes rise { from{transform:translateY(75vh) scale(.7);opacity:0} to{transform:none;opacity:1} }
  @keyframes pulse { to{transform:scale(1.06)} }
  @keyframes spin { to{transform:rotate(360deg)} }
  @keyframes twinkle { 50%{opacity:.15} }
  @keyframes cloudIn { from{transform:translateX(var(--from));opacity:0} to{transform:none;opacity:.96} }
  @keyframes drift { to{transform:translateX(var(--dx))} }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes drop { 0%{transform:translateY(0);opacity:0} 10%{opacity:1} 100%{transform:translateY(68vh);opacity:.2} }
  @keyframes ripple { from{transform:scale(.2);opacity:.9} to{transform:scale(1.5);opacity:0} }
  @keyframes snow { to{transform:translate(40px,108vh)} }
  @keyframes fogIn { from{opacity:0;transform:translateX(-30vw)} to{opacity:.6;transform:none} }
  @keyframes flash { 0%,91%,94%,100%{opacity:0} 92%{opacity:.75} 93%{opacity:.1} 95%{opacity:.55} }
  @keyframes auroraIn { to{opacity:.8} }
  @keyframes auroraWave { from{transform:skewX(-6deg) scaleY(.9)} to{transform:skewX(8deg) scaleY(1.15)} }
  @keyframes rbIn { to{opacity:.9} }
  @keyframes orb { to{transform:translate(14vmax,8vmax) scale(1.25)} }
  @keyframes shimmer { to{background-position:250% 0} }

  /* ===== المحتوى ===== */
  main { position:relative; z-index:1; max-width:720px; margin:0 auto; padding:28px 20px 48px; }
  form { display:flex; gap:10px; }
  input { flex:1; padding:14px 18px; font:inherit; color:#fff; background:var(--glass); border:1px solid var(--line);
    border-radius:14px; backdrop-filter:blur(10px); outline:none; }
  input::placeholder { color:rgba(255,255,255,.8); }
  input:focus-visible, button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  button { padding:0 24px; font:inherit; font-weight:700; cursor:pointer; color:#1a0b4d; border:0; border-radius:14px; text-shadow:none;
    background:linear-gradient(135deg,#fff,var(--ac)); }
  #msg { margin-top:12px; min-height:1.5em; font-weight:300; }

  .hero { display:flex; justify-content:center; align-items:center; gap:34px; margin:24px 0 14px; }
  .info { text-align:center; }
  .city { font-size:1.4rem; font-weight:500; }
  .temp { font-size:clamp(6rem,22vw,9.5rem); font-weight:300; line-height:1.05; direction:ltr; color:transparent;
    background:linear-gradient(90deg,#fff,var(--ac),#ff8ad8,#4de1ff,#fff) 0 0/250% 100%; -webkit-background-clip:text; background-clip:text;
    text-shadow:none; filter:drop-shadow(0 0 26px var(--ac)); animation:shimmer 7s linear infinite; }
  .desc { display:inline-block; margin-top:6px; padding:8px 26px; font-size:1.4rem; font-weight:500; border-radius:99px; border:2px solid var(--ac);
    background:rgba(255,255,255,.12); box-shadow:0 0 30px var(--ac), inset 0 0 14px rgba(255,255,255,.15); }

  /* مؤشر الحرارة: من أزرق جليدي إلى أحمر */
  .therm { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:.8rem; direction:ltr; }
  .tube { position:relative; width:24px; height:170px; border-radius:99px; overflow:hidden; background:rgba(255,255,255,.2);
    border:2px solid rgba(255,255,255,.65); }
  .tube i { position:absolute; left:0; right:0; bottom:0; height:50%; border-radius:99px; transition:height 1.4s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(to top,#8be9ff,#38bdf8 20%,#4ade80 42%,#facc15 62%,#fb923c 80%,#ef4444) bottom/100% 166px no-repeat; }
  .tube::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(to top,transparent 0 17px,rgba(255,255,255,.55) 17px 18px); }
  .bulb { width:40px; height:40px; margin-top:-18px; border-radius:50%; background:var(--tc); border:2px solid rgba(255,255,255,.7);
    box-shadow:0 0 24px var(--tc); transition:background 1.2s, box-shadow 1.2s; }

  .pillwrap { text-align:center; margin-bottom:22px; }
  .pill { display:inline-flex; align-items:center; gap:10px; padding:9px 20px; border-radius:99px; background:var(--glass);
    border:1px solid var(--tc); backdrop-filter:blur(10px); font-weight:500; box-shadow:0 0 24px -4px var(--tc); }
  .dot { width:12px; height:12px; border-radius:50%; background:var(--tc); box-shadow:0 0 12px var(--tc); }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .stat, .day { background:var(--glass); border:1px solid var(--line); border-radius:16px; backdrop-filter:blur(10px);
    transition:transform .25s, background .25s; }
  .stat { padding:16px 10px; text-align:center; border-top:3px solid var(--sc); box-shadow:0 10px 26px -12px var(--sc); }
  .stat:nth-child(1) { --sc:#ffb36b; } .stat:nth-child(2) { --sc:#4de1ff; } .stat:nth-child(3) { --sc:#d4a5ff; }
  .stat b { display:block; font-size:1.3rem; font-weight:700; direction:ltr; color:var(--sc); }
  .stat span { font-weight:300; font-size:.9rem; }
  .stat:hover { transform:translateY(-4px); background:rgba(255,255,255,.2); }
  h2 { margin:30px 0 12px; font-size:1.1rem; font-weight:500; }
  .days { display:grid; gap:8px; }
  .day { display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:16px; padding:12px 18px;
    border-inline-start:5px solid var(--dc); box-shadow:0 0 20px -8px var(--dc); }
  .day:hover { transform:translateX(-8px); background:rgba(255,255,255,.2); }
  .day .hi, .day .lo { font-weight:700; direction:ltr; display:inline-block; }
  .day .icon { font-size:1.4rem; }

  @media (max-width:480px) { .hero { gap:20px; } .tube { height:140px; } .tube i { background-size:100% 136px; } }
  @media (prefers-reduced-motion:reduce) {
    #scene *, body::before, body::after, .temp { animation:none !important; }
    .drop, .flake, .splash, .flash, .bolt { display:none; }
  }
</style>
</head>
<body>
<div id="scene" aria-hidden="true"></div>
<main>
  <form id="search">
    <input id="q" type="text" placeholder="اكتب اسم مدينة، مثلاً إربد" aria-label="اسم المدينة" autocomplete="off">
    <button type="submit">ابحث</button>
  </form>
  <p id="msg" role="status"></p>

  <section class="hero" id="hero" hidden>
    <div class="info">
      <div class="city" id="city"></div>
      <div class="temp" id="temp"></div>
      <div class="desc" id="desc"></div>
    </div>
    <div class="therm" aria-hidden="true">
      <b>45°</b>
      <div class="tube"><i id="fill"></i></div>
      <div class="bulb"></div>
      <b>-10°</b>
    </div>
  </section>

  <div class="pillwrap" id="pillwrap" hidden><div class="pill"><i class="dot"></i><span id="mood"></span></div></div>

  <section class="stats" id="stats" hidden>
    <div class="stat"><b id="feels"></b><span>الإحساس الفعلي</span></div>
    <div class="stat"><b id="wind"></b><span>الرياح</span></div>
    <div class="stat"><b id="hum"></b><span>الرطوبة</span></div>
  </section>

  <h2 id="ftitle" hidden>توقعات الأسبوع</h2>
  <section class="days" id="days"></section>
</main>

<script>
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const msg = $("msg");
let lastPlace, lastData, curKey = "sun";

/* ===== 1) الحالات: اسم وأيقونة ولون لكل حالة ===== */
const STATES = {
  sun:         { i:"☀️", n:"مشمس",        c:"#ffc83d" },
  sunclouds:   { i:"⛅", n:"غائم جزئياً", c:"#ffb15c" },
  dusk:        { i:"🌅", n:"غروب",        c:"#ff7a45" },
  dawn:        { i:"🌄", n:"شروق",        c:"#ff8fc7" },
  night:       { i:"🌙", n:"ليل صافي",    c:"#9a8cff" },
  nightclouds: { i:"☁️", n:"ليل غائم",    c:"#b58cff" },
  clouds:      { i:"☁️", n:"غائم",        c:"#a78bfa" },
  shower:      { i:"🌦️", n:"رذاذ",        c:"#2de2c8" },
  rain:        { i:"🌧️", n:"مطر",         c:"#3d8bff" },
  storm:       { i:"⛈️", n:"عاصفة رعدية", c:"#c05cff" },
  snow:        { i:"❄️", n:"ثلج",         c:"#8fd8ff" },
  fog:         { i:"🌫️", n:"ضباب",        c:"#ff9ecf" }
};
const SHOWERS = [51,53,55,56,57,80,81,82];
function classify(code, day) {            // رمز الطقس (WMO) -> حالة
  if (code === 0) return day ? "sun" : "night";
  if (code <= 2)  return day ? "sunclouds" : "nightclouds";
  if (code === 3) return "clouds";
  if (code <= 48) return "fog";
  if (SHOWERS.includes(code)) return "shower";
  if (code <= 67) return "rain";
  if (code <= 86) return "snow";
  return "storm";
}

/* ===== 2) المشهد: كل شي ملون ===== */
const PAL = {
  white: ["#ffffff","#fff0f6","#ffe8d0","#e6f2ff"],
  dusk:  ["#ffb3d1","#ffc58a","#ff9a7a","#e3a8ff"],
  night: ["#6a5cff","#9a5cff","#c050c8","#4a6bff"],
  over:  ["#ddd0ff","#ffc9e6","#c9e4ff","#ffe0b8","#cfd8ff"],
  rain:  ["#4a5bf0","#7a4fe8","#3d8bff","#2fb7e8"],
  shower:["#9ad0ff","#c0b0ff","#ffc0e0"],
  storm: ["#6a2fd0","#a02fc0","#d03090","#4a2fb0"],
  snow:  ["#ffffff","#d6ecff","#ffd9f0","#e6dcff"],
  fog:   ["#ff9ecf","#ffc58a","#b9a4ff","#8ef0ff"]
};
function buildScene(key, isDay) {
  const s = $("scene");
  s.innerHTML = "";
  const add = (cls, css, parent) => { const e = document.createElement("div"); e.className = cls; if (css) e.style.cssText = css; (parent || s).appendChild(e); return e; };
  const clouds = (n, pal) => { for (let i = 0; i < n; i++) { const dir = i % 2 ? 1 : -1;
    add("cloud", `--k:${rnd(.6,1.6)};--w:${rnd(170,340)}px;--c:${pick(pal)};--from:${-dir*60}vw;--dx:${dir*rnd(4,10)}vw;--d:${rnd(14,26)}s;`
      + `top:${6 + i*6 + rnd(0,6)}vh;left:${rnd(0,65)}vw;animation-delay:${i*.4}s,${3.2 + i*.4}s`); } };
  const rain = (lo, hi, n) => {
    const w = add("rain");
    for (let i = 0; i < n; i++) { const col = `hsl(${rnd(lo,hi)} 100% 70%)`;
      add("drop", `left:${rnd(0,100)}vw;background:linear-gradient(transparent,${col});box-shadow:0 0 6px ${col};animation-duration:${rnd(.55,1)}s;animation-delay:${-rnd(0,1)}s`, w); }
    for (let i = 0; i < 16; i++)
      add("splash", `left:${rnd(0,98)}vw;bottom:${rnd(2,7)}vh;border-color:hsl(${rnd(lo,hi)} 100% 75%);animation-delay:${-rnd(0,1)}s`, w);
  };
  const night = key === "night" || key === "nightclouds";

  if (night) {
    for (let i = 0; i < 70; i++) add("star", `left:${rnd(0,100)}vw;top:${rnd(0,65)}vh;--c:${pick(["#fff","#ffd6f5","#c6e5ff","#fff3b0"])};animation-delay:${-rnd(0,3)}s`);
    add("moon");
  }
  if (key === "night") { add("aurora"); add("aurora", "top:14vh;--h:70deg;animation-delay:2s,6s"); }
  if (["sun","sunclouds","dusk","dawn"].includes(key)) add("sun");
  if (key === "sunclouds") clouds(3, PAL.white);
  if (key === "dusk" || key === "dawn") clouds(3, PAL.dusk);
  if (key === "nightclouds") clouds(4, PAL.night);
  if (key === "clouds") clouds(6, PAL.over);
  if (key === "rain")   { clouds(5, PAL.rain); rain(170, 230, 110); }
  if (key === "shower") { clouds(4, PAL.shower); rain(160, 200, 80); if (isDay) add("rainbow"); }
  if (key === "storm")  { clouds(6, PAL.storm); rain(260, 330, 140); add("bolt"); add("flash"); }
  if (key === "snow") {
    clouds(4, PAL.snow);
    for (let i = 0; i < 80; i++) { const col = pick(PAL.snow);
      add("flake", `left:${rnd(0,100)}vw;background:${col};box-shadow:0 0 8px ${col};animation-duration:${rnd(6,12)}s;animation-delay:${-rnd(0,12)}s`); }
  }
  if (key === "fog") for (let i = 0; i < 5; i++)
    add("fogband", `top:${12 + i*15}vh;--c:${PAL.fog[i % 4]};--dx:${i % 2 ? 8 : -8}vw;--d:${rnd(12,20)}s;animation-delay:${i*.5}s,${3 + i*.5}s`);
  add("hills");
}

/* ===== 3) مؤشر الحرارة (نفس ألوان الأنبوب) ===== */
const TS = [[0,[139,233,255]],[.2,[56,189,248]],[.42,[74,222,128]],[.62,[250,204,21]],[.8,[251,146,60]],[1,[239,68,68]]];
const tf = t => Math.max(0, Math.min(1, (t + 10) / 55));
function tempColor(f) {
  for (let i = 1; i < TS.length; i++) if (f <= TS[i][0]) {
    const [a, A] = TS[i-1], [b, B] = TS[i], u = (f - a) / (b - a);
    return "rgb(" + A.map((v, j) => Math.round(v + (B[j] - v) * u)).join(",") + ")";
  }
  return "rgb(239,68,68)";
}
function moodOf(t, key) {
  if (key === "storm") return "⚠️ عاصفة رعدية، الأفضل البقاء بالداخل";
  if (key === "rain" || key === "shower") return "الجو ممطر، خذ مظلتك";
  if (key === "snow") return "ثلج، البس تقيل";
  if (key === "fog")  return "ضباب، انتبه بالسواقة";
  if (t < 5)  return "برد شديد";
  if (t < 14) return "بارد، خذ جاكيت";
  if (t < 24) return "طقس لطيف ومريح";
  if (t < 31) return "دافئ";
  if (t < 38) return "حار، اشرب مي كثير";
  return "حرارة شديدة، تجنب الشمس";
}

/* ===== 4) البحث عن المدينة ===== */
const ARABIC_CITIES = {
  "عمان":"Amman","اربد":"Irbid","الزرقاء":"Zarqa","العقبة":"Aqaba","السلط":"As-Salt","جرش":"Jerash","مادبا":"Madaba",
  "الكرك":"Karak","معان":"Ma'an","عجلون":"Ajloun","المفرق":"Mafraq","الطفيلة":"Tafilah","القدس":"Jerusalem",
  "دمشق":"Damascus","بيروت":"Beirut","بغداد":"Baghdad","القاهرة":"Cairo","الرياض":"Riyadh","جدة":"Jeddah","دبي":"Dubai",
  "الدوحة":"Doha","الكويت":"Kuwait City","تونس":"Tunis","الرباط":"Rabat","اسطنبول":"Istanbul","لندن":"London","باريس":"Paris","برلين":"Berlin"
};
async function getJSON(url) { const r = await fetch(url); if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }
async function findCity(raw) {
  const clean = raw.replace(/[\u064B-\u0652\u0640]/g, "").replace(/[إأآ]/g, "ا").replace(/ى/g, "ي").replace(/\s+/g, " ").trim();
  for (const name of [ARABIC_CITIES[clean], clean, raw].filter(Boolean)) {
    const res = await getJSON("https://geocoding-api.open-meteo.com/v1/search?count=1&language=ar&name=" + encodeURIComponent(name));
    if (res.results && res.results.length) return res.results[0];
  }
  return null;
}
async function getWeather(cityName) {
  msg.textContent = "جاري البحث...";
  try {
    const place = await findCity(cityName);
    if (!place) { msg.textContent = "ما لقيت هالمدينة. جرّب كتابة الاسم بالإنجليزي."; return; }
    lastPlace = place;
    lastData = await getJSON("https://api.open-meteo.com/v1/forecast?latitude=" + place.latitude + "&longitude=" + place.longitude
      + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,is_day"
      + "&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset&timezone=auto");
    render(place, lastData);
    msg.textContent = "✨ حرّك الماوس أو اضغط على الشاشة وجرّب";
    setTimeout(() => { if (msg.textContent.startsWith("✨")) msg.textContent = ""; }, 7000);
  } catch (err) {
    msg.textContent = "صار خطأ بالاتصال (" + err.message + "). افتح الملف من المتصفح مباشرة وتأكد من الإنترنت.";
    console.error(err);
  }
}

/* ===== 5) عرض النتائج ===== */
function render(place, data) {
  const c = data.current, t = c.temperature_2m, isDay = c.is_day === 1;
  let key = classify(c.weather_code, isDay);
  if (["sun","sunclouds","night"].includes(key)) {            // غروب أو شروق؟
    const now = new Date(c.time), rise = new Date(data.daily.sunrise[0]), set = new Date(data.daily.sunset[0]), m = 60000;
    if (now > set - 50*m && now < +set + 5*m) key = "dusk";
    else if (now > rise - 5*m && now < +rise + 50*m) key = "dawn";
  }
  curKey = key;
  const S = STATES[key], col = tempColor(tf(t));
  document.body.className = key;
  document.body.style.setProperty("--ac", S.c);
  document.body.style.setProperty("--tc", col);
  buildScene(key, isDay);

  $("city").textContent = place.name + (place.country ? "، " + place.country : "");
  $("temp").textContent = Math.round(t) + "°";
  $("desc").textContent = S.i + " " + S.n;
  $("fill").style.height = (tf(t) * 100) + "%";
  $("mood").textContent = moodOf(t, key);
  $("feels").textContent = Math.round(c.apparent_temperature) + "°";
  $("wind").textContent = Math.round(c.wind_speed_10m) + " km/h";
  $("hum").textContent = c.relative_humidity_2m + "%";
  ["hero", "pillwrap", "stats", "ftitle"].forEach(id => $(id).hidden = false);

  const d = data.daily;
  $("days").innerHTML = d.time.map((date, i) => {
    const dk = classify(d.weather_code[i], true), hi = d.temperature_2m_max[i], lo = d.temperature_2m_min[i];
    const name = i === 0 ? "اليوم" : new Date(date).toLocaleDateString("ar", { weekday: "long" });
    return '<div class="day" style="--dc:' + STATES[dk].c + '"><span>' + name + '</span><span class="icon">' + STATES[dk].i + '</span><span>'
      + '<span class="hi" style="color:' + tempColor(tf(hi)) + '">' + Math.round(hi) + '°</span> '
      + '<span class="lo" style="color:' + tempColor(tf(lo)) + '">' + Math.round(lo) + '°</span></span></div>';
  }).join("");
}

/* ===== 6) البحث + معاينة خفية: اكتب demo:storm مثلاً ===== */
const DEMOS = { sun:[0,1,31,"12:00"], sunclouds:[2,1,27,"12:00"], dusk:[0,1,22,"17:30"], dawn:[1,1,16,"06:40"],
  night:[0,0,14,"23:00"], nightclouds:[2,0,15,"23:00"], clouds:[3,1,20,"12:00"], shower:[80,1,18,"12:00"],
  rain:[63,1,12,"12:00"], storm:[95,1,16,"12:00"], snow:[73,1,-1,"12:00"], fog:[45,1,8,"12:00"] };
function demo(k) {
  const o = DEMOS[k];
  if (!o || !lastData) return false;
  const d = JSON.parse(JSON.stringify(lastData));
  Object.assign(d.current, { weather_code:o[0], is_day:o[1], temperature_2m:o[2], apparent_temperature:o[2] - 1, time:"2026-01-01T" + o[3] });
  d.daily.sunrise[0] = "2026-01-01T" + (k === "dawn" ? "06:30" : "06:00");
  d.daily.sunset[0]  = "2026-01-01T" + (k === "dusk" ? "17:45" : "18:00");
  render(lastPlace, d);
  msg.textContent = "🎬 معاينة: " + STATES[k].i + " " + STATES[k].n;
  return true;
}
$("search").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("q").value.trim();
  if (!name) return;
  const m = name.match(/^demo\s*[:：]\s*(\w+)$/i);
  if (m && demo(m[1].toLowerCase())) return;
  getWeather(name);
});

/* ===== 7) التفاعل: بارالاكس + شرارات ملونة + ضغط ===== */
const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
function spark(x, y, dist, size, life) {
  const col = pick([STATES[curKey].c, "#ff5ec8", "#4de1ff", "#ffe45e", "#7dff9b"]);
  const el = document.createElement("i");
  el.style.cssText = `position:fixed;left:${x}px;top:${y}px;width:${size}px;height:${size}px;margin:${-size/2}px 0 0 ${-size/2}px;`
    + `border-radius:50%;background:${col};box-shadow:0 0 12px ${col};pointer-events:none;z-index:5`;
  document.body.appendChild(el);
  const a = Math.random() * Math.PI * 2, d = rnd(dist * .4, dist);
  el.animate([{ transform:"translate(0,0) scale(1)", opacity:1 }, { transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.1)`, opacity:0 }],
    { duration:life, easing:"cubic-bezier(.2,.7,.3,1)" }).onfinish = () => el.remove();
}
function ring(x, y) {
  const el = document.createElement("i");
  el.style.cssText = `position:fixed;left:${x-40}px;top:${y-12}px;width:80px;height:24px;border:2px solid #4de1ff;border-radius:50%;pointer-events:none;z-index:5`;
  document.body.appendChild(el);
  el.animate([{ transform:"scale(.2)", opacity:1 }, { transform:"scale(4)", opacity:0 }], { duration:1100, easing:"ease-out" }).onfinish = () => el.remove();
}
function zap(x) {
  const f = document.createElement("div"), b = document.createElement("div");
  f.style.cssText = "position:fixed;inset:0;background:#fff;pointer-events:none;z-index:4;opacity:0";
  b.style.cssText = `position:fixed;left:${x-30}px;top:0;width:60px;height:70vh;background:#fff8c4;opacity:0;pointer-events:none;z-index:4;`
    + "clip-path:polygon(55% 0,15% 52%,45% 52%,25% 100%,85% 40%,52% 40%,75% 0);filter:drop-shadow(0 0 16px #ff5ec8)";
  document.body.append(f, b);
  f.animate([{opacity:0},{opacity:.6},{opacity:.1},{opacity:.4},{opacity:0}], { duration:650 }).onfinish = () => f.remove();
  b.animate([{opacity:0},{opacity:1},{opacity:.2},{opacity:1},{opacity:0}], { duration:650 }).onfinish = () => b.remove();
}
let lastTrail = 0;
addEventListener("pointermove", e => {
  if (calm) return;
  $("scene").style.setProperty("--mx", (e.clientX / innerWidth - .5) * 2);
  $("scene").style.setProperty("--my", (e.clientY / innerHeight - .5) * 2);
  if (e.pointerType === "mouse" && e.timeStamp - lastTrail > 45) { lastTrail = e.timeStamp; spark(e.clientX, e.clientY, 40, rnd(4, 8), 700); }
});
addEventListener("pointerdown", e => {
  if (calm || e.target.closest("input,button,form")) return;
  for (let i = 0; i < 24; i++) spark(e.clientX, e.clientY, rnd(90, 180), rnd(6, 12), rnd(700, 1200));
  if (curKey === "storm") zap(e.clientX);
  if (curKey === "rain" || curKey === "shower") ring(e.clientX, e.clientY);
});

getWeather("Amman");
</script>
